name: Build Android APKs

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'BOTH'
        type: choice
        options:
          - BOTH
          - FLUTTER
          - KOTLIN

jobs:
  # =========================================================================
  # 1. Flutter APK Job
  # Triggered when commit message contains 'DEPLOY' or 'FLUTTER', or manually
  # =========================================================================
  build-flutter:
    name: Build Flutter APK (Bike Tracker F)
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.head_commit.message, 'DEPLOY') ||
      contains(github.event.head_commit.message, 'FLUTTER') ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'BOTH' || github.event.inputs.target == 'FLUTTER')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: bike_tracker_app
        run: flutter pub get

      - name: Build APK (Release/Debug)
        working-directory: bike_tracker_app
        run: flutter build apk --debug

      - name: Upload Flutter APK
        uses: actions/upload-artifact@v4
        with:
          name: bike-tracker-flutter-apk
          path: bike_tracker_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  # =========================================================================
  # 2. Kotlin Native APK Job
  # Triggered when commit message contains 'DEPLOY' or 'KOTLIN', or manually
  # =========================================================================
  build-kotlin:
    name: Build Kotlin APK (Bike Tracker K)
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.head_commit.message, 'DEPLOY') ||
      contains(github.event.head_commit.message, 'KOTLIN') ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'BOTH' || github.event.inputs.target == 'KOTLIN')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Kotlin APK
        uses: actions/upload-artifact@v4
        with:
          name: bike-tracker-kotlin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
