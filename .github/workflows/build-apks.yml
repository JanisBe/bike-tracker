name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kotlin:
    name: Build Android APK (Bike Tracker)
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.head_commit.message, 'DEPLOY') ||
      contains(github.event.head_commit.message, 'KOTLIN') ||
      contains(github.event.head_commit.message, 'APK') ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Restore release keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > ~/.android/bike-tracker-release.jks

      - name: Build Release APK with Gradle
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bike-tracker-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare Release Assets
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk bike-tracker.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Latest APK Release' }}
          body: |
            🚴 **Bike Tracker APK Release**
            Automated build from commit `${{ github.sha }}`.

            ### Download
            - [bike-tracker.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}/bike-tracker.apk)
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            bike-tracker.apk
