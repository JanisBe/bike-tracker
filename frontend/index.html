<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bike Tracker • Trasy rowerowe i telemetria GPX</title>
  <meta content="Aplikacja do śledzenia treningów rowerowych i interaktywna mapa tras z pobieraniem plików GPX."
        name="description">
  <meta name="theme-color" content="#0B0B1A">

  <!-- Open Graph -->
  <meta content="Bike Tracker • Trasy rowerowe" property="og:title">
  <meta content="Odkrywaj trasy rowerowe na interaktywnej ciemnej mapie i pobieraj ślady GPX."
        property="og:description">
  <meta property="og:type" content="website">

  <!-- Google Fonts: Outfit (headings) & Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar: Journey Log -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24">
              <path d="M15.5,5.5c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM5,12c-2.8,0 -5,2.2 -5,5s2.2,5 5,5 5,-2.2 5,-5 -2.2,-5 -5,-5zM5,20.5c-1.9,0 -3.5,-1.6 -3.5,-3.5s1.6,-3.5 3.5,-3.5 3.5,1.6 3.5,3.5 -1.6,3.5 -3.5,3.5zM10.8,10.5l2.4,-2.4 1.8,1.8c1.3,1.3 3,2.1 4.9,2.1v-2c-1.4,0 -2.6,-0.6 -3.5,-1.5l-1.9,-1.9c-0.4,-0.4 -0.9,-0.6 -1.5,-0.6s-1.1,0.2 -1.5,0.6l-3.2,3.2c-0.4,0.4 -0.6,0.9 -0.6,1.4 0,0.6 0.2,1.1 0.6,1.5l3.2,3.2V20h2v-4.8l-2.7,-2.7zM19,12c-2.8,0 -5,2.2 -5,5s2.2,5 5,5 5,-2.2 5,-5 -2.2,-5 -5,-5zM19,20.5c-1.9,0 -3.5,-1.6 -3.5,-3.5s1.6,-3.5 3.5,-3.5 3.5,1.6 3.5,3.5 -1.6,3.5 -3.5,3.5z"/>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">Bike Tracker</h1>
            <p class="brand-subtitle">Dziennik treningów</p>
          </div>
        </div>

          <!-- User Profile Bar -->
          <div class="user-profile-bar" id="user-profile-bar">
              <div class="user-info" id="user-info" style="display: none;">
                  <div class="user-avatar" id="user-avatar">?</div>
                  <div class="user-text">
                      <span class="user-name" id="user-name">Użytkownik</span>
                      <span class="user-email" id="user-email">email@example.com</span>
                  </div>
                  <button aria-label="Wyloguj" class="btn-logout" id="btn-logout" title="Wyloguj się">
                      <svg fill="currentColor" height="16" viewBox="0 0 24 24" width="16">
                          <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                      </svg>
                  </button>
              </div>
              <div class="user-guest" id="user-guest">
                  <button class="btn-login-open" id="btn-login-open">
                      <svg fill="currentColor" height="16" viewBox="0 0 24 24" width="16">
                          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                      </svg>
                      <span>Zaloguj się</span>
                  </button>
              </div>
          </div>

          <!-- Overall Telemetry Banner -->
        <div class="stats-banner">
          <div class="stat-item">
            <div class="stat-value" id="stat-total-distance">0.0 km</div>
            <div class="stat-label">Dystans</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="stat-total-rides">0</div>
            <div class="stat-label">Treningi</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="stat-total-hours">0.0 h</div>
            <div class="stat-label">Czas</div>
          </div>
        </div>
      </div>

      <!-- Controls & Filter Bar -->
      <div class="controls-bar">
        <input aria-label="Szukaj treningów" class="search-input" id="search-input"
               placeholder="Szukaj treningów..." type="text">
        <button class="btn-overview" id="btn-overview" title="Pokaż wszystkie trasy na mapie">
          Wszystkie trasy
        </button>
      </div>

      <!-- Activity Calendar Widget -->
      <div class="calendar-container" id="calendar-widget-container">
        <!-- Rendered dynamically by calendar-widget.js -->
      </div>

      <!-- Rides List -->
      <div aria-label="Lista treningów" class="rides-list" id="rides-list" role="region">
        <!-- Rendered dynamically by app.js -->
      </div>
    </aside>

    <!-- Map Area -->
    <main class="map-container">
      <div id="map"></div>

      <!-- Floating Detail Panel (Active on selection) -->
      <div class="floating-detail-panel" id="floating-detail">
        <h2 class="detail-title" id="detail-title">Wybrany trening</h2>
        <div class="detail-subtitle" id="detail-date">—</div>

        <div class="detail-grid">
          <div class="detail-item-box">
            <div class="detail-item-label">Dystans</div>
            <div class="detail-item-val" id="detail-dist">—</div>
          </div>
          <div class="detail-item-box">
            <div class="detail-item-label">Czas trwania</div>
            <div class="detail-item-val" id="detail-dur">—</div>
          </div>
          <div class="detail-item-box">
            <div class="detail-item-label">Śr. prędkość</div>
            <div class="detail-item-val" id="detail-avg">—</div>
          </div>
          <div class="detail-item-box">
            <div class="detail-item-label">Przewyższenie</div>
            <div class="detail-item-val" id="detail-ele">—</div>
          </div>
        </div>

        <button class="btn-download-gpx" id="btn-detail-gpx" style="width: 100%; justify-content: center; padding: 10px; font-size: 13px;">
          <span>⬇</span> Pobierz pełny plik GPX
        </button>
      </div>

        <!-- Ride Profile Chart Panel (Speed & Elevation) -->
        <section aria-label="Profil trasy: prędkość i wysokość" class="profile-chart-panel" id="profile-chart-panel">
            <div class="profile-chart-header">
                <div class="profile-chart-title-group">
                    <h3 class="profile-chart-title">Profil trasy</h3>
                    <!-- Live Scrub Tooltip Banner -->
                    <div class="profile-scrub-tooltip" id="profile-scrub-tooltip" style="display: none;">
                        <span class="scrub-badge scrub-dist" id="scrub-dist">0.0 km</span>
                        <span class="scrub-badge scrub-speed" id="scrub-speed">⚡ 0.0 km/h</span>
                        <span class="scrub-badge scrub-ele" id="scrub-ele">⛰️ 0 m</span>
                    </div>
                </div>

                <!-- Interactive Clickable Legend -->
                <div aria-label="Przełączniki serii wykresu" class="profile-legend" role="toolbar">
                    <button aria-pressed="true" class="legend-btn active" id="btn-toggle-speed"
                            title="Kliknij, aby ukryć/pokazać prędkość" type="button">
                        <span class="legend-dot speed-dot"></span>
                        <span class="legend-label">Prędkość</span>
                    </button>
                    <button aria-pressed="true" class="legend-btn active" id="btn-toggle-elevation"
                            title="Kliknij, aby ukryć/pokazać wysokość" type="button">
                        <span class="legend-dot ele-dot"></span>
                        <span class="legend-label">Wysokość</span>
                    </button>
                    <button aria-label="Zwiń lub rozwiń wykres profilu" class="btn-toggle-panel"
                            id="btn-toggle-chart-collapse"
                            title="Zwiń / Rozwiń wykres" type="button">
                        <span id="collapse-icon">▾</span>
                    </button>
                </div>
            </div>

            <div class="profile-chart-body" id="profile-chart-body">
                <canvas height="150" id="profile-canvas"></canvas>
            </div>
        </section>
    </main>

      <!-- Auth Modal Dialog -->
      <div class="modal-overlay" id="auth-modal" style="display: none;">
          <div aria-labelledby="auth-modal-title" aria-modal="true" class="auth-card" role="dialog">
              <button aria-label="Zamknij" class="btn-modal-close" id="btn-auth-close" title="Zamknij">✕</button>

              <div class="auth-header">
                  <div class="auth-logo">🚴</div>
                  <h2 class="auth-title" id="auth-modal-title">Bike Tracker</h2>
                  <p class="auth-subtitle" id="auth-modal-subtitle">Zaloguj się, aby wyświetlić swoje treningi</p>
              </div>

              <!-- Auth Tabs: Logowanie / Rejestracja -->
              <div class="auth-tabs" role="tablist">
                  <button aria-selected="true" class="auth-tab active" id="tab-login" role="tab">Logowanie</button>
                  <button aria-selected="false" class="auth-tab" id="tab-register" role="tab">Rejestracja</button>
              </div>

              <!-- Error Alert Box -->
              <div class="auth-alert" id="auth-alert" style="display: none;">
                  <span class="auth-alert-icon">⚠️</span>
                  <span class="auth-alert-msg" id="auth-alert-msg"></span>
              </div>

              <!-- Google Sign In Button -->
              <button class="btn-google-auth" id="btn-google-auth" type="button">
                  <svg class="google-icon" height="18" viewBox="0 0 24 24" width="18">
                      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                            fill="#4285F4"/>
                      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853"/>
                      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                            fill="#FBBC05"/>
                      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
                            fill="#EA4335"/>
                  </svg>
                  <span id="google-auth-text">Kontynuuj przez Google</span>
              </button>

              <div class="auth-divider">
                  <span>LUB ADRES E-MAIL</span>
              </div>

              <!-- Email / Password Form -->
              <form class="auth-form" id="auth-form">
                  <div class="form-group">
                      <label for="auth-email">Adres e-mail</label>
                      <input autocomplete="email" id="auth-email" placeholder="twoj@email.pl" required type="email">
                  </div>
                  <div class="form-group">
                      <label for="auth-password">Hasło</label>
                      <input autocomplete="current-password" id="auth-password" minlength="6" placeholder="••••••••"
                             required
                             type="password">
                  </div>
                  <button class="btn-auth-submit" id="btn-auth-submit" type="submit">
                      <span class="btn-spinner" id="auth-spinner" style="display: none;"></span>
                      <span id="auth-submit-text">Zaloguj się</span>
                  </button>
              </form>
          </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Application Controller -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
